[build]
builder = "NIXPACKS"
# Install deps, build React (outputs to client/dist), then copy to server/public for Express to serve
buildCommand = "npm install --prefix server && npm install --prefix client && npm run build --prefix client && mkdir -p server/public && cp -r client/dist/. server/public/"

[deploy]
startCommand = "node server/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
